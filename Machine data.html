        // ================= HELPERS =================
        function getMachineQty(machine) {
            let sum = 0;
            Object.values(machine.brands).forEach(brandArr => {
                brandArr.forEach(item => {
                    if (item.qty && !isNaN(item.qty)) sum += Number(item.qty);
                });
            });
            return sum;
        }

        // ================= GLOBAL SEARCH =================
        function globalSearch(query) {
            const results = [];
            const lowerQuery = query.toLowerCase().trim();
            if (!lowerQuery) return results;

            Object.keys(structuredDatabase).forEach(deptKey => {
                const dept = structuredDatabase[deptKey];
                dept.machines.forEach((machine, machineIndex) => {
                    Object.keys(machine.brands).forEach(brandName => {
                        machine.brands[brandName].forEach(item => {
                            if (item.model && item.model.toLowerCase().includes(lowerQuery)) {
                                results.push({
                                    deptKey,
                                    deptName: deptKey,
                                    machineIndex,
                                    machineName: machine.name,
                                    brandName,
                                    model: item.model,
                                    qty: item.qty
                                });
                            }
                        });
                    });
                });
            });
            return results;
        }

        function renderGlobalSearchResults(query) {
            const results = globalSearch(query);
            if (results.length === 0) {
                contentList.innerHTML = `<div class="text-center py-8 text-slate-400">No models found for "${query}"</div>`;
            } else {
                contentList.innerHTML = results.map(result => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition-all flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${result.deptName}</span>
                                <span class="text-xs text-slate-400">/</span>
                                <span class="text-xs font-medium text-slate-600">${result.machineName}</span>
                                <span class="text-xs text-slate-400">/</span>
                                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">${result.brandName}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-lg mt-2 font-mono">${result.model}</h4>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <span class="text-xs text-slate-400 font-medium block">Quantity (DRL)</span>
                                <span class="text-lg font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">${result.qty}</span>
                            </div>
                            <button onclick="navigateToModel('${result.deptKey}', ${result.machineIndex}, '${result.brandName}')" 
                                    class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-2 rounded-lg transition-colors">
                                View
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function navigateToModel(deptKey, machineIndex, brandName) {
            // Clear search and navigate
            searchInput.value = '';
            lastSearchQuery = '';
            selectDepartment(deptKey);
            selectMachineCategory(machineIndex);
            selectBrand(brandName);
        }

        // ================= APPLY SEARCH =================
        function applySearch() {
            const query = searchInput.value;
            if (query.trim() !== '') {
                // Global search mode
                lastSearchQuery = query;
                panelTitle.textContent = `Search Results for "${query}"`;
                panelSubtitle.textContent = `Showing all machines with matching model numbers`;
                itemCountBadge.textContent = `${globalSearch(query).length} Results`;
                renderGlobalSearchResults(query);
            } else {
                // Restore current level view
                lastSearchQuery = '';
                if (currentLevel === 'ROOT') {
                    renderRootMenu();
                } else if (currentLevel === 'DEPT') {
                    selectDepartment(selectedDeptKey);
                } else if (currentLevel === 'CATEGORY') {
                    selectMachineCategory(structuredDatabase[selectedDeptKey].machines.indexOf(selectedMachineObj));
                } else if (currentLevel === 'BRAND') {
                    selectBrand(selectedBrandName);
                }
            }
        }

            panelTitle.textContent = "Dekko Isho Group – Overview";
            panelSubtitle.textContent = "Click a department to explore machines";
            placeholder.classList.add('hidden');
            contentList.classList.remove('hidden');
            searchInput.value = '';
            lastSearchQuery = '';
            searchInput.disabled = false;

            const deptKeys = Object.keys(structuredDatabase);
            const totalAll = deptKeys.reduce((acc, key) => acc + structuredDatabase[key].total, 0);
            itemCountBadge.textContent = `${totalAll} Total`;
            itemCountBadge.classList.remove('hidden');

            navMenu.innerHTML = deptKeys.map(key => `
                <button onclick="selectDepartment('${key}')" 
                        class="w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-800 font-bold hover:bg-blue-100 transition-all flex justify-between items-center shadow-sm">
                    <span>${key}</span>
                    <span class="text-xs bg-blue-200 text-blue-900 px-2.5 py-1 rounded-lg">${structuredDatabase[key].total}</span>
                </button>
            `).join('');

            contentList.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${deptKeys.map((key, idx) => {
                        const dept = structuredDatabase[key];
                        const gradient = idx === 0 ? 'from-blue-500 to-indigo-600' : 'from-emerald-500 to-teal-600';
                        return `
                        <div onclick="selectDepartment('${key}')" 
                             class="bg-gradient-to-br ${gradient} text-white p-6 rounded-2xl shadow-md cursor-pointer hover:scale-[1.02] transition-all">
                            <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold">${idx === 0 ? 'Sewing Section' : 'Non-Sewing Section'}</span>
                            <h3 class="text-2xl font-bold mt-3">${key}</h3>
                            <p class="text-blue-100 text-sm mt-1">Total Quantity: ${dept.total}</p>
                            <p class="text-blue-100 text-xs mt-2">${dept.machines.length} Categories</p>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function selectDepartment(deptKey) {
            currentLevel = 'DEPT';
            selectedDeptKey = deptKey;
            selectedMachineObj = null;
            selectedBrandName = null;
            backBtn.classList.remove('hidden');
            menuHeading.textContent = "Categories";
            breadcrumbTrail.innerHTML = `
                <span onclick="renderRootMenu()" class="cursor-pointer hover:underline">Root</span> / 
                <span class="text-blue-600 font-bold">${deptKey}</span>`;
            panelTitle.textContent = deptKey;
            panelSubtitle.textContent = "Select a machine category";
            searchInput.value = '';
            lastSearchQuery = '';
            searchInput.disabled = false;

            const dept = structuredDatabase[deptKey];
            itemCountBadge.textContent = `${dept.machines.length} Categories`;
            placeholder.classList.add('hidden');
            contentList.classList.remove('hidden');

            navMenu.innerHTML = dept.machines.map(m => `
                <button onclick="selectMachineCategory(${dept.machines.indexOf(m)})" 
                        class="w-full text-left px-4 py-3 rounded-xl text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-700 transition-all flex justify-between items-center group border border-transparent">
                    <span class="truncate pr-2 text-sm font-semibold">${m.name}</span>
                    <span class="bg-slate-100 text-slate-600 group-hover:bg-blue-200 group-hover:text-blue-800 text-xs py-1 px-2.5 rounded-lg font-bold">
                        ${getMachineQty(m)} units
                    </span>
                </button>
            `).join('');

            contentList.innerHTML = dept.machines.map(m => {
                const qty = getMachineQty(m);
                const brandCount = Object.keys(m.brands).length;
                return `
                <div onclick="selectMachineCategory(${dept.machines.indexOf(m)})" 
                     class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition-all cursor-pointer flex justify-between items-center group">
                    <div>
                        <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">Category #${dept.machines.indexOf(m)+1}</span>
                        <h4 class="font-bold text-slate-800 mt-2 text-base group-hover:text-blue-700 transition-colors">${m.name}</h4>
                        <p class="text-xs text-slate-500 mt-1">Brands: ${brandCount} | Total Qty: ${qty}</p>
                    </div>
                    <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg group-hover:bg-blue-600 group-hover:text-white font-bold transition-colors">View ➔</span>
                </div>`;
            }).join('');
        }

        function selectMachineCategory(machineIndex) {
            currentLevel = 'CATEGORY';
            selectedMachineObj = structuredDatabase[selectedDeptKey].machines[machineIndex];
            selectedBrandName = null;
            menuHeading.textContent = "Brands";
            breadcrumbTrail.innerHTML = `
                <span onclick="renderRootMenu()" class="cursor-pointer hover:underline">Root</span> / 
                <span onclick="selectDepartment(selectedDeptKey)" class="cursor-pointer hover:underline">${selectedDeptKey}</span> / 
                <span class="text-blue-600 font-bold">${selectedMachineObj.name}</span>`;
            panelTitle.textContent = selectedMachineObj.name;
            panelSubtitle.textContent = "Select a brand to view models";
            searchInput.value = '';
            lastSearchQuery = '';
            searchInput.disabled = false;

            const brandNames = Object.keys(selectedMachineObj.brands);
            itemCountBadge.textContent = `${brandNames.length} Brands`;
            placeholder.classList.add('hidden');
            contentList.classList.remove('hidden');

            navMenu.innerHTML = brandNames.map(brand => {
                const models = selectedMachineObj.brands[brand];
                const brandQty = models.reduce((acc, m) => acc + (Number(m.qty) || 0), 0);
                return `
                <button onclick="selectBrand('${brand}')" 
                        class="w-full text-left px-4 py-3 rounded-xl text-slate-700 font-medium hover:bg-emerald-50 hover:text-emerald-700 transition-all flex justify-between items-center group border border-transparent">
                    <span class="truncate pr-2 font-bold text-slate-800">${brand}</span>
                    <span class="bg-emerald-100 text-emerald-800 text-xs py-1 px-2.5 rounded-lg font-bold">${models.length} models / ${brandQty} units</span>
                </button>`;
            }).join('');

            contentList.innerHTML = brandNames.map(brand => {
                const models = selectedMachineObj.brands[brand];
                const brandQty = models.reduce((acc, m) => acc + (Number(m.qty) || 0), 0);
                return `
                <div onclick="selectBrand('${brand}')" 
                     class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-emerald-300 transition-all cursor-pointer flex justify-between items-center group">
                    <div>
                        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">Brand</span>
                        <h4 class="font-bold text-slate-800 mt-2 text-lg group-hover:text-emerald-700 transition-colors">${brand}</h4>
                        <p class="text-xs text-slate-500 mt-1">Models: ${models.length} | Total Qty: ${brandQty}</p>
                    </div>
                    <span class="text-sm font-extrabold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">View ➔</span>
                </div>`;
            }).join('');
        }

        function selectBrand(brandName) {
            currentLevel = 'BRAND';
            selectedBrandName = brandName;
            menuHeading.textContent = "Models & Qty";
            breadcrumbTrail.innerHTML = `
                <span onclick="renderRootMenu()" class="cursor-pointer hover:underline">Root</span> / 
                <span onclick="selectDepartment(selectedDeptKey)" class="cursor-pointer hover:underline">${selectedDeptKey}</span> / 
                <span onclick="selectMachineCategory(${structuredDatabase[selectedDeptKey].machines.indexOf(selectedMachineObj)})" class="cursor-pointer hover:underline">${selectedMachineObj.name}</span> / 
                <span class="text-blue-600 font-bold">${brandName}</span>`;
            panelTitle.textContent = `${selectedMachineObj.name} – ${brandName}`;
            panelSubtitle.textContent = "Detailed model list with quantities";
            searchInput.value = '';
            lastSearchQuery = '';
            searchInput.disabled = false;

            const modelList = selectedMachineObj.brands[brandName];
            itemCountBadge.textContent = `${modelList.length} Models`;
            placeholder.classList.add('hidden');
            contentList.classList.remove('hidden');

            navMenu.innerHTML = modelList.map(m => `
                <div class="px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 flex justify-between items-center">
                    <span class="font-mono">${m.model}</span>
                    <span class="bg-blue-600 text-white px-2 py-0.5 rounded-md">${m.qty}</span>
                </div>
            `).join('');

            contentList.innerHTML = modelList.map(item => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-4 hover:border-blue-300 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm border border-blue-100">⚙️</div>
                        <div>
                            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Model Number</span>
                            <h4 class="font-bold text-slate-900 text-base font-mono">${item.model}</h4>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-400 font-medium block">Quantity (DRL)</span>
                        <span class="text-lg font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100 inline-block mt-0.5">${item.qty}</span>
                    </div>
                </div>
            `).join('');
        }

        function goBack() {
            if (currentLevel === 'BRAND') {
                selectMachineCategory(structuredDatabase[selectedDeptKey].machines.indexOf(selectedMachineObj));
            } else if (currentLevel === 'CATEGORY') {
                selectDepartment(selectedDeptKey);
            } else if (currentLevel === 'DEPT') {
                renderRootMenu();
            }
        }

        function exportCSV() {
            let csv = "Department,Category,Brand,Model,Quantity\n";
            Object.keys(structuredDatabase).forEach(deptKey => {
                const dept = structuredDatabase[deptKey];
                dept.machines.forEach(machine => {
                    Object.keys(machine.brands).forEach(brand => {
                        machine.brands[brand].forEach(item => {
                            csv += `"${deptKey}","${machine.name}","${brand}","${item.model}",${item.qty}\n`;
                        });
                    });
                });
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'machine_data.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Event listeners
        searchInput.addEventListener('input', applySearch);
        window.onload = renderRootMenu;
    </script>
</body>
</html>
